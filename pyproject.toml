[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "python-selenium-outlook"
version = "1.0.0"
description = "Selenium browser-automation demo: log in to Outlook webmail and list inbox subjects"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
keywords = ["selenium", "browser-automation", "outlook", "web-scraping", "webdriver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "selenium==4.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[project.scripts]
outlook-demo = "outlook:main"

[tool.setuptools]
py-modules = ["outlook"]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
